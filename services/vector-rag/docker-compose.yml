# The two services behind the vector RAG demo. Start with `npm run up`, stop with `npm run down`.
#
#   Qdrant  http://localhost:6333            vector database, dashboard at http://localhost:6333/dashboard
#   Ollama  http://localhost:11434           runs the embedding model
#
# Ollama inside Docker runs on the CPU only (no Apple GPU access from a container). That is fast
# enough for the handbook. If you have Ollama installed natively, start only Qdrant:
#   docker compose up -d qdrant
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  qdrant-data:
  ollama-data:
